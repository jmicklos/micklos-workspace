# Home Automation Dashboard
# Paste into HA: Settings → Dashboards → Add → Edit → Raw Configuration Editor
#
# Prerequisites:
#   HVAC: Daikin integration via Faikin (6/7 live — top floor ducted pending)
#   Lights: Smart switches via Zigbee (Zigbee2MQTT)
#   Cameras: UniFi Protect integration
#   Velux: VELUX Active KIX 300 gateway
#   Media: Sonos + Samsung SmartThings
#   Appliances: Home Connect (Miele)

title: Home
views:
  # ═══════════════════════════════════════
  # VIEW 0: QUICK ACTIONS
  # ═══════════════════════════════════════
  # Scripts must be created separately in HA:
  # Settings → Automations & Scenes → Scripts → Add → Edit in YAML
  # See ha-scripts.yaml in this folder for script definitions.
  - title: Home
    path: home
    icon: mdi:home
    type: sections
    sections:
      - type: grid
        title: Modes
        cards:
          - type: tile
            entity: input_boolean.vacation_mode
            name: Vacation Mode
            icon: mdi:airplane
            color: orange

      - type: grid
        title: Quick Actions
        cards:
          - type: button
            entity: script.adu_nighttime
            name: ADU Nighttime
            icon: mdi:weather-night
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.adu_nighttime
            show_state: false
          - type: button
            entity: script.adu_morning
            name: ADU Morning
            icon: mdi:weather-sunny
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.adu_morning
            show_state: false
          - type: button
            entity: script.all_lights_off
            name: All Lights Off
            icon: mdi:lightbulb-off
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.all_lights_off
            show_state: false

  # ═══════════════════════════════════════
  # VIEW 1: HVAC
  # ═══════════════════════════════════════
  - title: HVAC
    path: hvac
    icon: mdi:hvac
    type: sections
    sections:
      # ── ADU ──
      - type: grid
        title: ADU
        cards:
          - type: thermostat
            entity: climate.adu_living_room_hvac_controller
            name: ADU Living Room
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only
          - type: thermostat
            entity: climate.adu_bedroom_hvac_controller
            name: ADU Bedroom
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only

      # ── Main Floor ──
      - type: grid
        title: Main Floor
        cards:
          - type: thermostat
            entity: climate.kitchen_hvac_controller
            name: Kitchen
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only
          - type: thermostat
            entity: climate.study_hvac_controller
            name: Study
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only
          - type: thermostat
            entity: climate.dining_room_hvac_controller
            name: Dining Room
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only
          - type: thermostat
            entity: climate.living_room_hvac_controller
            name: Living Room
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only

      # ── Top Floor ──
      - type: grid
        title: Top Floor
        cards:
          # TODO: Update entity ID once Faikin adapter is installed on FDMQ18
          - type: thermostat
            entity: climate.top_floor_hvac_controller
            name: Top Floor (Ducted)
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - heat
                  - heat_cool
                  - fan_only

      # ── At a Glance ──
      - type: grid
        title: All Zones
        cards:
          - type: glance
            title: Inside Temps
            show_name: true
            show_state: true
            entities:
              - entity: sensor.adu_living_room_hvac_controller_inside_temperature
                name: ADU Living
              - entity: sensor.adu_bedroom_hvac_controller_inside_temperature
                name: ADU Bed
              - entity: sensor.kitchen_hvac_controller_inside_temperature
                name: Kitchen
              - entity: sensor.study_hvac_controller_inside_temperature
                name: Study
              - entity: sensor.dining_room_hvac_controller_inside_temperature
                name: Dining
              - entity: sensor.living_room_hvac_controller_inside_temperature
                name: Living
          - type: glance
            title: Outside Temp
            show_name: true
            show_state: true
            entities:
              - entity: sensor.kitchen_hvac_controller_outside_temperature
                name: Outside


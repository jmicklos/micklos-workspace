  # ═══════════════════════════════════════
  # VIEW 7: ENERGY
  # ═══════════════════════════════════════
  # Currently appliance-level only (Miele Home Connect).
  # For whole-home monitoring, consider adding an Emporia Vue or Sense
  # energy monitor, then use HA's built-in Energy Dashboard for cost tracking.
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt
    type: sections
    sections:
      - type: grid
        title: Washing Machine
        cards:
          - type: sensor
            entity: sensor.adu_washing_machine_energy_consumption
            name: Energy Used
            graph: line
          - type: sensor
            entity: sensor.adu_washing_machine_water_consumption
            name: Water Used
            graph: line
          - type: entities
            title: Forecasts
            entities:
              - entity: sensor.adu_washing_machine_energy_forecast
                name: Energy Forecast
              - entity: sensor.adu_washing_machine_water_forecast
                name: Water Forecast

      - type: grid
        title: Dryer
        cards:
          - type: sensor
            entity: sensor.adu_dryer_energy_consumption
            name: Energy Used
            graph: line
          - type: entities
            title: Forecast
            entities:
              - entity: sensor.adu_dryer_energy_forecast
                name: Energy Forecast

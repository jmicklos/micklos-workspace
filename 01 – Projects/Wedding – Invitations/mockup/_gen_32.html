<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:'Brand';src:url('assets/brand.woff2') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}
  @font-face{font-family:'DidotItalic';src:url('assets/didot-italic.woff2') format('woff2');font-weight:normal;font-style:normal;font-display:swap;}
  :root{ --ink:#2b2b2b; --soft:#4a4a4a; --gold:#C9A961; --paper:#ffffff;
    --body-serif:'Didot','Cormorant Garamond','Didot LT STD',Georgia,serif;
    --display:'Brand','Didot','Cormorant Garamond',serif; --label:'Jost',sans-serif;
    --frame:inset 0 0 0 24px var(--paper), inset 0 0 0 25px rgba(201,169,97,0.6), inset 0 0 0 31px var(--paper), inset 0 0 0 32px rgba(201,169,97,0.25); }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;-webkit-font-smoothing:antialiased;}
  .card{width:5in;height:7in;background:var(--paper);box-shadow:var(--frame);padding:0.55in 0.5in;display:flex;flex-direction:column;align-items:center;text-align:center;}
  .front{justify-content:center;}
  .building{width:74%;display:block;margin:0 auto 22px;}
  .names{font-family:var(--display);font-weight:400;color:var(--ink);line-height:1.05;}
  .name-line{font-size:36px;letter-spacing:-0.05em;}
  .amp{font-family:var(--display);font-size:33px;line-height:.95;font-weight:300;margin:2px 0 4px;color:var(--gold);}
  .request{font-family:var(--body-serif);font-size:14.5px;letter-spacing:.02em;line-height:1.55;margin-top:22px;color:var(--soft);}
  .guest{font-family:var(--display);text-transform:uppercase;font-size:18px;letter-spacing:.08em;line-height:1.3;color:var(--ink);margin:7px auto 5px;max-width:94%;text-wrap:balance;}
  .req2{font-family:var(--body-serif);font-size:14.5px;letter-spacing:.02em;line-height:1.55;color:var(--soft);}
  .date{font-family:var(--display);font-size:16.5px;letter-spacing:.12em;padding-left:.12em;margin-top:26px;color:var(--ink);}
  .time{font-family:var(--display);font-size:13px;letter-spacing:.14em;padding-left:.14em;margin-top:5px;color:var(--ink);}
  .venue{font-family:var(--body-serif);font-size:14px;letter-spacing:.02em;line-height:1.5;margin-top:24px;color:var(--soft);}
  .venue .v-name{font-size:15px;}
  .reception{font-family:'DidotItalic','Didot',var(--body-serif);font-style:italic;font-size:22px;letter-spacing:.01em;margin-top:1.15em;color:var(--soft);line-height:1.1;}
  /* single-line names keep the reception -> tighten the rhythm a touch so top/bottom margins match the two-line cards */
  .front.single .request{margin-top:16px;}
  .front.single .guest{margin:5px auto 3px;}
  .front.single .date{margin-top:18px;}
  .front.single .venue{margin-top:18px;}
  .front.single .reception{margin-top:0.6em;}
  @page{size:5in 7in;margin:0;}
</style>
</head>
<body>
  <div class="card front">
    <img class="building" src="assets/building.png" alt="Casino Español">
    <div class="names">
      <div class="name-line">Wan&nbsp;Ting&nbsp;Lee</div>
      <div class="amp">&amp;</div>
      <div class="name-line">Jonathan&nbsp;Micklos</div>
    </div>
    <div class="request">request the pleasure of your company</div>
    <div class="guest">Jimmy&nbsp;Winn</div>
    <div class="req2">at the celebration of their marriage</div>
    <div class="date">SATURDAY,&nbsp;THE&nbsp;TWELFTH&nbsp;OF&nbsp;DECEMBER</div>
    <div class="time">AT&nbsp;SIX&nbsp;O&rsquo;CLOCK&nbsp;IN&nbsp;THE&nbsp;EVENING</div>
    <div class="venue"><span class="v-name">Casino Espa&ntilde;ol</span><br>Isabel la Cat&oacute;lica 29, Centro Hist&oacute;rico<br>Ciudad de M&eacute;xico</div>
    <div class="reception">Evening reception to follow</div>
  </div>
<script>
  function fit(){ var card=document.querySelector('.card.front'), g=document.querySelector('.guest'), r=document.querySelector('.reception');
    if(g){ var lh=parseFloat(getComputedStyle(g).lineHeight);
      if(g.getBoundingClientRect().height > lh*1.6){ if(r) r.remove(); }   /* multi-line: drop reception */
      else { if(card) card.classList.add('single'); } } }                  /* single-line: keep + tighten */
  if(document.fonts&&document.fonts.ready){ document.fonts.ready.then(function(){ fit(); requestAnimationFrame(fit); }); }
  else { window.addEventListener('load', fit); }
</script>
</body>
</html>
